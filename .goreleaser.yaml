version: 2

builds:
  - main: ./cmd/passgen
    binary: passgen
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags: ["-s -w"]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  # any semver prerelease suffix (-alpha.N, -beta.N, -rc.N) is marked as a prerelease
  prerelease: auto

# a formula (not a cask) so brew installs the unsigned darwin binary without a Gatekeeper warning
brews:
  - name: passgen
    repository:
      owner: jhot21
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/jhot21/passgen
    description: Deterministic password generator from a simple passphrase
    # prereleases (-rc.N etc.) must not update the tap
    skip_upload: auto
    test: |
      assert_match(/\A\S{40}\z/, shell_output("#{bin}/passgen --print --salt=test hello").strip)
