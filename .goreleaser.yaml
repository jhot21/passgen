version: 2

builds:
  - main: ./cmd/passgen
    binary: passgen
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags: ["-s -w"]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  # any semver prerelease suffix (-alpha.N, -beta.N, -rc.N) is marked as a prerelease
  prerelease: auto
